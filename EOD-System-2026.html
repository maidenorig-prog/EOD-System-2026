var CSS_TEXT = "/* ===== tokens ===== */\n:root{\n  --bg:#F7E3E7;\n  --surface:#FFFFFF;\n  --surface-alt:#FBF1F3;\n  --ink:#505155;\n  --ink-muted:#8D8E91;\n  --ink-faint:#B0B1B3;\n  --accent:#F3157F;\n  --accent-strong:#C21166;\n  --accent-soft:#FDD0E5;\n  --line:#F7CADB;\n  --line-strong:#F6B0CD;\n  --good:#2F7A4F;\n  --good-soft:#DCEEE1;\n  --warn:#9C6A0A;\n  --warn-soft:#F5E6C8;\n  --critical:#B0392A;\n  --critical-soft:#F6DAD3;\n  --focus:#4F6FE0;\n  --shadow:0 1px 2px rgba(80,81,85,0.08), 0 6px 20px -8px rgba(80,81,85,0.22);\n  --radius:14px;\n  --radius-sm:9px;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#221820;\n    --surface:#2E2029;\n    --surface-alt:#3A2733;\n    --ink:#FBEAF3;\n    --ink-muted:#C9AFC0;\n    --ink-faint:#957F8F;\n    --accent:#F9B1DB;\n    --accent-strong:#FAC1E2;\n    --accent-soft:#55123B;\n    --line:#3B2F38;\n    --line-strong:#544550;\n    --good:#7BCB9A;\n    --good-soft:#213A2A;\n    --warn:#E3B559;\n    --warn-soft:#3B2F16;\n    --critical:#E28270;\n    --critical-soft:#3D241E;\n    --focus:#8FA6FF;\n    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#221820;\n  --surface:#2E2029;\n  --surface-alt:#3A2733;\n  --ink:#FBEAF3;\n  --ink-muted:#C9AFC0;\n  --ink-faint:#957F8F;\n  --accent:#F9B1DB;\n  --accent-strong:#FAC1E2;\n  --accent-soft:#55123B;\n  --line:#3B2F38;\n  --line-strong:#544550;\n  --good:#7BCB9A;\n  --good-soft:#213A2A;\n  --warn:#E3B559;\n  --warn-soft:#3B2F16;\n  --critical:#E28270;\n  --critical-soft:#3D241E;\n  --focus:#8FA6FF;\n  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 10px 30px -10px rgba(0,0,0,0.5);\n}\n\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  font-family:\"Manrope\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  background:var(--bg);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,.display{\n  font-family:\"Fraunces\",Georgia,\"Times New Roman\",serif;\n  font-weight:600;\n  text-wrap:balance;\n  letter-spacing:-0.01em;\n}\n.mono,input[type=\"number\"],.count-input,td.num,.tabular{\n  font-family:\"IBM Plex Mono\",\"SFMono-Regular\",Menlo,Consolas,monospace;\n  font-variant-numeric:tabular-nums;\n}\na{color:var(--accent)}\nbutton{font-family:inherit}\n\n/* ===== shell ===== */\n.shell{max-width:1040px;margin:0 auto;padding:0 20px 64px}\n.topbar{\n  position:sticky;top:0;z-index:20;\n  background:var(--bg);\n  padding:22px 20px 0;\n  border-bottom:1px solid var(--line);\n}\n.topbar-inner{max-width:1040px;margin:0 auto}\n.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}\n.brand .mark{\n  font-family:\"Fraunces\",serif;font-weight:600;font-size:1.5rem;color:var(--ink);\n}\n.brand-logo{height:38px;width:auto;display:block}\n.brand .loc{\n  font-size:0.8rem;color:var(--ink-muted);letter-spacing:0.04em;text-transform:uppercase;\n}\n.tagline{color:var(--ink-muted);font-size:0.92rem;margin:0 0 16px;max-width:60ch}\n\n.tabbar{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}\n.tabbar::-webkit-scrollbar{display:none}\n.tab{\n  display:flex;align-items:center;gap:8px;white-space:nowrap;\n  padding:10px 14px;border:none;background:none;color:var(--ink-muted);\n  font-weight:600;font-size:0.92rem;cursor:pointer;border-radius:10px 10px 0 0;\n  border-bottom:2px solid transparent;margin-bottom:-1px;\n}\n.tab svg{width:17px;height:17px;flex:none}\n.tab:hover{color:var(--ink)}\n.tab.active{color:var(--accent);border-bottom-color:var(--accent)}\n.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{\n  outline:2px solid var(--focus);outline-offset:2px;\n}\n\nmain{padding-top:24px}\n.section-head{margin-bottom:18px}\n.section-head h1{font-size:1.4rem;margin:0 0 4px}\n.section-head p{margin:0;color:var(--ink-muted);font-size:0.92rem;max-width:62ch}\n\n/* ===== layout bits ===== */\n.card{\n  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);\n  box-shadow:var(--shadow);padding:20px;margin-bottom:18px;\n}\n.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}\n.card-head h2{font-size:1.05rem;margin:0}\n.card-head h3{font-size:0.98rem;margin:0;font-family:\"Manrope\";font-weight:700}\n.stack{display:flex;flex-direction:column;gap:14px}\n.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}\n.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n\n.loc-picker{display:flex;gap:10px;flex-wrap:wrap}\n.loc-btn{\n  padding:16px 22px;border-radius:var(--radius);border:1px solid var(--line-strong);\n  background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;\n  min-width:150px;text-align:left;transition:border-color .15s, box-shadow .15s;\n}\n.loc-btn:hover{border-color:var(--accent)}\n.loc-btn .sub{display:block;font-weight:500;font-size:0.78rem;color:var(--ink-muted);margin-top:3px}\n.loc-btn.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset}\n\nlabel{font-size:0.82rem;font-weight:600;color:var(--ink-muted);display:block;margin-bottom:5px}\ninput[type=\"text\"],input[type=\"date\"],input[type=\"number\"],select,textarea{\n  width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);\n  background:var(--surface);color:var(--ink);font-size:0.95rem;\n}\ntextarea{resize:vertical;min-height:90px}\n.field{min-width:160px}\n.field.grow{flex:1}\n\n.btn{\n  display:inline-flex;align-items:center;gap:8px;justify-content:center;\n  padding:11px 18px;border-radius:999px;border:1px solid var(--line-strong);\n  background:var(--surface);color:var(--ink);font-weight:700;font-size:0.92rem;cursor:pointer;\n  transition:transform .08s ease, border-color .15s;\n}\n.btn:active{transform:scale(0.98)}\n.btn-primary{background:var(--accent);border-colo   /* ---------- tiny helpers ---------- */
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function formatDateLong(dateStr){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  }
  function formatDateShort(dateStr){
    var parts = dateStr.split("-").map(Number);
    return parts[1]+"/"+parts[2];
  }

    if(!iso) return "";
    var d = new Date(iso);
    return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  }
  function slugify(s){
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }
  function uniqueId(base, existingIds){
    var id = base, n = 2;
    while(existingIds.indexOf(id) !== -1){ id = base+"-"+n; n++; }
    return id;
  }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function displayName(it){
    if(!it) return "";
    return (it.brand ? it.brand+" " : "") + it.name;
  }

  /* ---------- data helpers ---------- */
  function allLocations(){
    var set = {}, order = [];
    (STATE.locations||[]).forEach(function(l){ if(!set[l]){set[l]=true; order.push(l);} });
    return order;
  }
  function catalogTabs(){
    var set = {}, order = [];
    (STATE.catalogTabs||[]).forEach(function(t){ if(!set[t]){set[t]=true; order.push(t);} });
    (STATE.catalog||[]).forEach(function(it){ if(!set[it.tab]){set[it.tab]=true; order.push(it.tab);} });
    return order;
  }
  function catalogFor(tab){
    return (STATE.catalog||[]).filter(function(it){ return it.tab===tab; });
  }
  function catalogBySubcategory(tab){
    var items = catalogFor(tab);
    var order = [], groups = {};
    items.forEach(function(it){
      var sub = it.subcategory || "Other";
      if(!groups[sub]){ groups[sub]=[]; order.push(sub); }
      groups[sub].push(it);
    });
    return order.map(function(sub){ return {subcategory:sub, items:groups[sub]}; });
  }
  function searchCatalog(tab, query){
    var items = catalogFor(tab);
    query = (query||"").trim().toLowerCase();
    if(!query) return items;
    return items.filter(function(it){
      var hay = ((it.brand||"")+" "+it.name+" "+(it.subcategory||"")).toLowerCase();
      return hay.indexOf(query) !== -1;
    });
  }
  function findCatalogItem(id){
    var catalog = STATE.catalog||[];
    for(var i=0;i<catalog.length;i++){ if(catalog[i].id===id) return catalog[i]; }
    return null;
  }
  function lastEntryFor(loc){
    var entries = (STATE.entries||[]).filter(function(e){ return e.location===loc; });
    if(!entries.length) return null;
    entries.sort(function(a,b){ return a.date<b.date?1:-1; });
    return entries[0];
  }
  function getEntry(date, loc){
    for(var i=0;i<STATE.entries.length;i++){
      var e = STATE.entries[i];
      if(e.date===date && e.location===loc) return e;
    }
    return null;
  }
  function getPrevEntry(date, loc){
    var candidates = STATE.entries.filter(function(e){ return e.location===loc && e.date < date; });
    if(!candidates.length) return null;
    candidates.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    return candidates[0];
  }
  function allDatesDesc(){
    var set = {};
    STATE.entries.forEach(function(e){ set[e.date]=true; });
    return Object.keys(set).sort().reverse();
  }
  function copyRisk(entry, prevEntry){
    if(!entry || !prevEntry) return {pct:0, overlap:0, curTotal:0, prevTotal:0, flag:false};
    var curIds = (entry.restocks||[]).map(function(r){ return r.id; });
    var prevIds = (prevEntry.restocks||[]).map(function(r){ return r.id; });
    if(!curIds.length || !prevIds.length) return {pct:0, overlap:0, curTotal:curIds.length, prevTotal:prevIds.length, flag:false};
    var prevSet = {}; prevIds.forEach(function(id){ prevSet[id]=true; });
    var overlap = curIds.filter(function(id){ return prevSet[id]; }).length;
    var unionSet = {}; curIds.concat(prevIds).forEach(function(id){ unionSet[id]=true; });
    var unionSize = Object.keys(unionSet).length;
    var pct = unionSize ? overlap/unionSize : 0;
    return {pct:pct, overlap:overlap, curTotal:curIds.length, prevTotal:prevIds.length, flag: curIds.length>=2 && pct>=0.8};
  }
  function copyRiskFromDraft(prevEntry){
    var curIds = Object.keys(ui.count.selected);
    if(!prevEntry || !curIds.length) return {flag:false};
    var prevIds = (prevEntry.restocks||[]).map(function(r){ return r.id; });
    if(!prevIds.length) return {flag:false};
    var prevSet = {}; prevIds.forEach(function(id){ prevSet[id]=true; });
    var overlap = curIds.filter(function(id){ return prevSet[id]; }).length;
    var unionSet = {}; curIds.concat(prevIds).forEach(function(id){ unionSet[id]=true; });
    var unionSize = Object.keys(unionSet).length;
    var pct = unionSize ? overlap/unionSize : 0;
    return {overlap:overlap, curTotal:curIds.length, prevTotal:prevIds.length, pct:pct, flag: curIds.length>=2 && pct>=0.8};
  }
  function blankFrontDesk(){
    return {
      delay: { ok: true, detail: "" },
      unfinished: { ok: true, detail: "" },
      guestIssue: { ok: true, detail: "" },
      equipment: { ok: true, detail: "" }
    };
  }
  function frontDeskAnyFlag(fd){
    return !!(fd && (!fd.delay.ok || !fd.unfinished.ok || !fd.guestIssue.ok || !fd.equipment.ok));
  }
  function frontDeskSummary(fd){
    if(!fd) return "No note logged.";
    var lines = [];
    if(!fd.delay.ok) lines.push("Delay: " + (fd.delay.detail||""));
    if(!fd.unfinished.ok) lines.push("Unfinished: " + (fd.unfinished.detail||""));
    if(!fd.guestIssue.ok) lines.push("Guest issue: " + (fd.guestIssue.detail||""));
    if(!fd.equipment.ok) lines.push("Equipment: " + (fd.equipment.detail||""));
    return lines.length ? lines.join("  ·  ") : "No delays, unfinished services, complaints, or equipment problems.";
  }
  function staffingSummary(s){
    if(!s) return "No note logged.";
    if(s.ok) return STAFFING_OK;

  }

  /* ---------- TAB: Reorder Dashboard ---------- */
  function renderDashboard(){
    var dates = allDatesDesc();
    if(!dates.length){
      return emptyState("No counts logged yet", "Once a location saves tonight’s restock list, it shows up here automatically — ready to hand to a supplier.", "count", "Log tonight’s count");
    }
    if(!ui.dashboardDate || dates.indexOf(ui.dashboardDate)===-1) ui.dashboardDate = dates[0];

    out += '<div class="card"><div class="row"><div class="field">' +
      '<label for="f-report-date">Date</label><select id="f-report-date" data-action="set-report-date">' +
      dates.map(function(d){ return '<option value="'+d+'"'+(d===date?" selected":"")+'>'+formatDateLong(d)+'</option>'; }).join("") +
      '</select></div></div></div>';

    var locs = allLocations();
    var allReorders = [];
    locs.forEach(function(loc){
      var entry = getEntry(date, loc);
      if(!entry) return;
      var prev = getPrevEntry(date, loc);
      var risk = copyRisk(entry, prev);
      var restocks = entry.nothingToRestock ? [] : (entry.restocks||[]);

      var pill;
      if(!restocks.length){
        pill = '<span class="pill pill-neutral">Nothing to restock</span>';

      } else {
        pill = '<span class="pill pill-ok">Looks real</span>';

      out += '<div class="card"><div class="card-head"><h2>'+escapeHtml(loc)+'</h2>' + pill + '</div>';
      out += '<p class="helper" style="margin:-6px 0 12px">Closed by '+escapeHtml(entry.closer||"unknown")+' at '+formatTime(entry.submittedAt)+
             (prev ? ' · compared to '+formatDateLong(prev.date)+' ('+escapeHtml(prev.closer||"unknown")+')' : ' · first night on record for this location') + '</p>';

      var staffFlag = entry.staffing && !entry.staffing.ok;
      var fdFlag = frontDeskAnyFlag(entry.frontDesk);
      var cleanFlag = entry.cleaning && entry.cleaning !== CLEANING_OK;
      var opsFlag = entry.opsNotes && entry.opsNotes !== OPS_OK;
      out += '<div class="grid-2" style="margin-bottom:14px">' +
        '<div class="banner '+(staffFlag?"banner-warn":"banner-info")+'">'+(staffFlag?ICONS.warn:"")+'<div><strong>Staffing & Attendance</strong><br>'+escapeHtml(staffingSummary(entry.staffing))+'</div></div>' +
        '<div class="banner '+(fdFlag?"banner-warn":"banner-info")+'">'+(fdFlag?ICONS.warn:"")+'<div><strong>Front Desk & Salon</strong><br>'+escapeHtml(frontDeskSummary(entry.frontDesk))+'</div></div>' +
        '<div class="banner '+(cleanFlag?"banner-warn":"banner-info")+'">'+(cleanFlag?ICONS.warn:"")+'<div><strong>Cleaning Duties</strong><br>'+escapeHtml(entry.cleaning||"No note logged.")+'</div></div>' +
        '<div class="banner '+(opsFlag?"banner-warn":"banner-info")+'">'+(opsFlag?ICONS.warn:"")+'<div><strong>Operational Notes</strong><br>'+escapeHtml(entry.opsNotes||"No note logged.")+'</div></div>' +
        '</div>';

      if(!restocks.length){
        out += '<div class="banner banner-good">Nothing needed restocking tonight.</div>';
      } else {
        out += '<div class="table-wrap"><table><thead><tr><th>Category</th><th>Item</th><th>Note</th></tr></thead><tbody>';
        restocks.forEach(function(r){
          var it = findCatalogItem(r.id);
          var cat = it ? it.tab + (it.subcategory ? " · "+it.subcategory : "") : "—";
          out += '<tr><td>'+escapeHtml(cat)+'</td><td>'+escapeHtml(it?displayName(it):r.id)+'</td><td>'+escapeHtml(r.note||"")+'</td></tr>';
          allReorders.push({loc:loc, tab: it?it.tab:"", name: it?displayName(it):r.id, note:r.note||""});
        });
        out += '</tbody></table></div>';
      }
      out += '</div>';
    });

    out += '<div class="card"><div class="card-head"><h2>Order list for '+formatDateLong(date)+'</h2></div>';
    if(!allReorders.length){
      out += '<div class="banner banner-good">Nothing needs restocking anywhere tonight — no order needed.</div>';
    } else {
      out += '<div class="table-wrap"><table><thead><tr><th>Location</th><th>Category</th><th>Item</th><th>Note</th></tr></thead><tbody>';
      allReorders.forEach(function(r){
        out += '<tr><td>'+escapeHtml(r.loc)+'</td><td>'+escapeHtml(r.tab)+'</td><td>'+escapeHtml(r.name)+'</td><td>'+escapeHtml(r.note)+'</td></tr>';
      });
      out += '</tbody></table></div>';
      var listText = allReorders.map(function(r){ return r.loc+" — "+r.name+" ("+r.tab+")"+(r.note?": "+r.note:""); }).join("\n");
      out += '<label style="margin-top:14px" for="order-text">Plain-text version (select all to copy)</label><textarea id="order-text" class="copy-box" rows="'+Math.min(allReorders.length+1,10)+'" readonly onclick="this.select()">'+escapeHtml(listText)+'</textarea>';
    }
    out += '</div>';
    return out;
  }

  /* ---------- TAB: History ---------- */
  function renderHistory(){
    if(!STATE.entries.length){
      return emptyState("No history yet", "Every night you save a count, it’s recorded here permanently — the record Discord never kept.", "count", "Log tonight’s count");
    }
    var sorted = STATE.entries.slice().sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (b.submittedAt||"").localeCompare(a.submittedAt||"");
    });
    var out = '<div class="section-head"><h1>History</h1><p>Every night, every location — a permanent record instead of a scrolled-away message.</p></div>';
    out += '<div class="card"><div class="table-wrap"><table><thead><tr><th></th><th>Date</th><th>Location</th><th>Closer</th><th>Restocks</th><th>Copy risk</th><th>Notes</th></tr></thead><tbody>';
    sorted.forEach(function(e){
      var prev = getPrevEntry(e.date, e.location);
      var risk = copyRisk(e, prev);
      var restocks = e.nothingToRestock ? [] : (e.restocks||[]);
      var key = e.date+"|"+e.location;
      var open = !!ui.historyOpen[key];
      var staffFlag = e.staffing && !e.staffing.ok;
      var fdFlag = frontDeskAnyFlag(e.frontDesk);
      var cleanFlag = e.cleaning && e.cleaning !== CLEANING_OK;
      var opsFlag = e.opsNotes && e.opsNotes !== OPS_OK;
      var notesFlag = staffFlag || fdFlag || cleanFlag || opsFlag;
      out += '<tr><td><button class="history-toggle" data-action="toggle-history" data-key="'+key+'"><svg class="chev'+(open?" open":"")+'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"></path></svg></button></td>' +
        '<td>'+formatDateLong(e.date)+'</td><td>'+escapeHtml(e.location)+'</td><td>'+escapeHtml(e.closer||"—")+'</td>' +
        '<td>'+(restocks.length ? '<span class="pill pill-reorder">'+restocks.length+'</span>' : '<span class="pill pill-ok">0</span>')+'</td>' +
        '<td>'+(prev ? (risk.flag ? '<span class="pill pill-warn">'+risk.overlap+'/'+risk.curTotal+'</span>' : '<span class="pill pill-ok">ok</span>') : '<span class="pill pill-neutral">n/a</span>')+'</td>' +
        '<td>'+(e.frontDesk===undefined && e.opsNotes===undefined ? '<span class="pill pill-neutral">n/a</span>' : (notesFlag ? '<span class="pill pill-warn">Review</span>' : '<span class="pill pill-ok">Clear</span>'))+'</td></tr>';
      if(open){
        out += '<tr class="detail-row"><td></td><td colspan="6">' +
          '<div class="stack" style="margin-bottom:12px">' +
          '<div><strong>Staffing & Attendance:</strong> '+escapeHtml(staffingSummary(e.staffing))+'</div>' +
          '<div><strong>Front Desk & Salon:</strong> '+escapeHtml(frontDeskSummary(e.frontDesk))+'</div>' +
          '<div><strong>Cleaning Duties:</strong> '+escapeHtml(e.cleaning||"No note logged.")+'</div>' +
          '<div><strong>Operational Notes:</strong> '+escapeHtml(e.opsNotes||"No note logged.")+'</div>' +
          '</div>';
        if(!restocks.length){
          out += '<div class="banner banner-good">Nothing needed restocking.</div>';
        } else {
          out += '<div class="table-wrap"><table><thead><tr><th>Category</th><th>Item</th><th>Note</th></tr></thead><tbody>';
          restocks.forEach(function(r){
            var it = findCatalogItem(r.id);
            out += '<tr><td>'+escapeHtml(it?it.tab:"—")+'</td><td>'+escapeHtml(it?displayName(it):r.id)+'</td><td>'+escapeHtml(r.note||"")+'</td></tr>';
          });
          out += '</tbody></table></div>';
        }
        out += '</td></tr>';
      }
    });
    out += '</tbody></table></div></div>';
    return out;
  }

  /* ---------- TAB: Manage ---------- */
  function renderManage(){
    if(!ui.manageDraft){
      ui.manageDraft = {
        catalog: JSON.parse(JSON.stringify(STATE.catalog||[])),
        locations: allLocations().slice(),
        catalogTabs: catalogTabs().slice()
      };
    }
    var draft = ui.manageDraft;
    var out = '<div class="section-head"><h1>Manage</h1><p>Locations and the real product catalog staff search from each night.</p></div>';

    out += '<div class="card"><div class="card-head"><h2>Locations</h2></div>';
    if(draft.locations.length){
      out += '<div class="table-wrap"><table><tbody>';
      draft.locations.forEach(function(loc){
        out += '<tr><td style="font-weight:700;padding:8px 10px">'+escapeHtml(loc)+'</td></tr>';
      });
      out += '</tbody></table></div>';
    } else {
      out += '<p class="helper">No locations yet.</p>';
    }
    out += '<div class="row" style="margin-top:12px"><div class="field grow"><input type="text" id="new-loc-name" placeholder="e.g. The Woodlands"></div>' +
      '<button class="btn" data-action="add-location">Add location</button></div></div>';

    draft.catalogTabs.forEach(function(tab){
      var items = draft.catalog.filter(function(it){ return it.tab===tab; });
      out += '<div class="card"><div class="card-head"><h2>'+escapeHtml(tab)+'</h2>' +
        '<button class="btn btn-sm btn-ghost" data-action="add-catalog-item" data-tab="'+escapeHtml(tab)+'">+ Add item</button></div>';
      out += '<div class="table-wrap"><table><thead><tr><th>Brand</th><th>Item</th><th>Subcategory</th><th></th></tr></thead><tbody>';
      items.forEach(function(it){
        out += '<tr data-row-id="'+it.id+'">' +
          '<td><input type="text" data-field="brand" data-id="'+it.id+'" value="'+escapeHtml(it.brand||"")+'"></td>' +
          '<td><input type="text" data-field="name" data-id="'+it.id+'" value="'+escapeHtml(it.name)+'"></td>' +
          '<td><input type="text" data-field="subcategory" data-id="'+it.id+'" value="'+escapeHtml(it.subcategory||"")+'"></td>' +
          '<td><button class="btn btn-sm btn-danger" data-action="remove-catalog-item" data-id="'+it.id+'">Remove</button></td>' +
          '</tr>';
      });
      if(!items.length){
        out += '<tr><td colspan="4" class="helper" style="padding:14px 10px">No items yet in '+escapeHtml(tab)+'.</td></tr>';
      }
      out += '</tbody></table></div></div>';
    });

    out += '<div class="card"><div class="card-head"><h3>Add a new category tab</h3></div>' +
      '<div class="row"><div class="field grow"><input type="text" id="new-tab-name" placeholder="e.g. Makeup"></div>' +
      '<button class="btn" data-action="add-catalog-tab">Add tab</button></div></div>';

    out += '<div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" data-action="discard-manage">Discard changes</button>' +
      '<button class="btn btn-primary" data-action="save-catalog" '+(ui.saving?"disabled":"")+'>'+(ui.saving?"Saving…":"Save changes")+'</button></div>';
    return out;
  }

  function emptyState(title, body, tab, cta){
    return '<div class="card empty-state">'+ICONS.box+'<h3>'+escapeHtml(title)+'</h3><p>'+escapeHtml(body)+'</p>' +
      '<button class="btn btn-primary" data-action="tab" data-tab="'+tab+'">'+escapeHtml(cta)+'</button></div>';
  }

  /* ---------- toast ---------- */
  function showToast(msg){
    var existing = document.querySelector(".toast");
    if(existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3600);
  }

  /* ---------- persistence ---------- */
  function buildDocument(newState){
    var head = '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      '<title>EOD</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">\n' +
      '<style>:root{color-scheme:light}body{margin:0;background:#F7E3E7}</style>';
    var script = 'var STATE = ' + JSON.stringify(newState) + ';\n' +
      'var CSS_TEXT = ' + JSON.stringify(CSS_TEXT) + ';\n' +
      '(' + appMain.toString() + ')();';
    return '<!doctype html>\n<html lang="en" data-theme="light">\n<head>\n' + head + '\n</head>\n<body>\n<div id="app"></div>\n<script>\n' + script + '\n<' + '/script>\n</body>\n</html>';
  }

  async function save(newState, successMsg){
    if(ui.saving) return;
    ui.saving = true; render();
    try{
      await DOC_REF.set(newState);
      STATE = newState;
      ui.saving = false;
      render();
      showToast(successMsg);
    } catch(err){
      ui.saving = false;
      render();
      showToast("Couldn\u2019t save \u2014 " + (err && err.message ? err.message : "check your Firebase setup") + ".");
    }
  }

  /* ---------- actions ---------- */
  function selectLocation(loc){
    ui.count.location = loc;
    ui.count._loadedFor = null;
    render();
  }

  function toggleCatalogItem(id){
    if(id in ui.count.selected){
      delete ui.count.selected[id];
    } else {
      ui.count.selected[id] = "";
      ui.count.nothingToRestock = false;
    }
    render();
  }

  function submitCount(){
    var loc = ui.count.location, date = ui.count.date;
    if(!loc) return;
    if(!ui.count.closer || !ui.count.closer.trim()){
      showToast("Enter the closer’s name before saving.");
      return;
    }
    if(!ui.count.staffing.ok){
      if(!(ui.count.staffing.detail||"").trim()){
        showToast("Note who and what happened, or check “Everyone on time.”");
        return;
      }
      if(!ui.count.staffing.coverage){
        showToast("Choose whether coverage was arranged.");
        return;
      }
    }
    var FD_LABELS = { delay: "the delay", unfinished: "the unfinished service", guestIssue: "the guest issue", equipment: "the equipment problem" };
    var fdKeys = ["delay", "unfinished", "guestIssue", "equipment"];
    for(var fi=0; fi<fdKeys.length; fi++){
      var fdField = ui.count.frontDesk[fdKeys[fi]];
      if(!fdField.ok && !(fdField.detail||"").trim()){
        showToast("Describe " + FD_LABELS[fdKeys[fi]] + ", or check the box above it.");
        return;
      }
    }
    var ids = Object.keys(ui.count.selected);
    if(!ui.count.nothingToRestock && !ids.length){
      showToast("Flag at least one item to restock, or check “Nothing needs restocking tonight.”");
      return;
    }
    if(!ui.count.cleaningOk && !(ui.count.cleaningText||"").trim()){
      showToast("Note what cleaning is left, or check “Yes — all done.”");
      return;
    }
    if(!ui.count.opsOk && !(ui.count.opsText||"").trim()){
      showToast("Add the operational note, or check “Nothing to flag.”");
      return;
    }
    var restocks = ui.count.nothingToRestock ? [] : ids.map(function(id){
      return {id:id, note:(ui.count.selected[id]||"").trim()};
    });

    var newState = JSON.parse(JSON.stringify(STATE));
    var idx = newState.entries.findIndex(function(e){ return e.date===date && e.location===loc; });
    var entry = {
      date:date, location:loc, closer: ui.count.closer.trim(),
      staffing: {
        ok: !!ui.count.staffing.ok,
        detail: ui.count.staffing.ok ? "" : ui.count.staffing.detail.trim(),
        coverage: ui.count.staffing.ok ? "" : ui.count.staffing.coverage
      },
      frontDesk: {
        delay: { ok: !!ui.count.frontDesk.delay.ok, detail: ui.count.frontDesk.delay.ok ? "" : ui.count.frontDesk.delay.detail.trim() },
        unfinished: { ok: !!ui.count.frontDesk.unfinished.ok, detail: ui.count.frontDesk.unfinished.ok ? "" : ui.count.frontDesk.unfinished.detail.trim() },
        guestIssue: { ok: !!ui.count.frontDesk.guestIssue.ok, detail: ui.count.frontDesk.guestIssue.ok ? "" : ui.count.frontDesk.guestIssue.detail.trim() },
        equipment: { ok: !!ui.count.frontDesk.equipment.ok, detail: ui.count.frontDesk.equipment.ok ? "" : ui.count.frontDesk.equipment.detail.trim() }
      },
      restocks: restocks, nothingToRestock: !!ui.count.nothingToRestock,
      cleaning: ui.count.cleaningOk ? CLEANING_OK : ui.count.cleaningText.trim(),
      opsNotes: ui.count.opsOk ? OPS_OK : ui.count.opsText.trim(),
      submittedAt: new Date().toISOString()
    };
    if(idx>=0) newState.entries[idx] = entry; else newState.entries.push(entry);
    save(newState, "Saved tonight’s restock list for " + loc + ".");
  }

  function addCatalogItem(tab){
    var draft = ui.manageDraft;
    var existingIds = draft.catalog.map(function(it){ return it.id; });
    var id = uniqueId(slugify(tab)+"-new-item", existingIds);
    draft.catalog.push({id:id, tab:tab, brand:"", name:"New item", subcategory:""});
    render();
  }
  function removeCatalogItem(id){
    ui.manageDraft.catalog = ui.manageDraft.catalog.filter(function(it){ return it.id!==id; });
    render();
  }
  function addCatalogTab(name){
    name = (name||"").trim();
    if(!name) return;
    if(ui.manageDraft.catalogTabs.indexOf(name)===-1) ui.manageDraft.catalogTabs.push(name);
    render();
  }
  function addLocation(name){
    name = (name||"").trim();
    if(!name) return;
    if(ui.manageDraft.locations.indexOf(name)===-1) ui.manageDraft.locations.push(name);
    render();
  }
  function saveManageDraft(){
    var draft = ui.manageDraft;
    var newState = JSON.parse(JSON.stringify(STATE));
    newState.catalog = draft.catalog;
    newState.locations = draft.locations;
    newState.catalogTabs = draft.catalogTabs;
    ui.manageDraft = null;
    save(newState, "Catalog updated.");
  }
  function readDraftFromInputs(){
    var draft = ui.manageDraft;
    document.querySelectorAll("[data-field]").forEach(function(input){
      var id = input.getAttribute("data-id"), field = input.getAttribute("data-field");
      var it = draft.catalog.find(function(x){ return x.id===id; });
      if(!it) return;
      it[field] = input.value;
    });
  }

  /* ---------- event wiring ---------- */
  function wireDynamic(){
    var app = document.getElementById("app");

    app.querySelectorAll('[data-action="set-restock-note"]').forEach(function(inp){
      inp.addEventListener("input", function(){
        ui.count.selected[inp.getAttribute("data-id")] = inp.value;
      });
    });

    var dateInput = app.querySelector('[data-action="set-date"]');
    if(dateInput) dateInput.addEventListener("change", function(){ ui.count.date = dateInput.value; ui.count._loadedFor=null; render(); });
    var closerInput = app.querySelector('[data-action="set-closer"]');
    if(closerInput){
      closerInput.addEventListener("input", function(){ ui.count.closer = closerInput.value; });
      closerInput.addEventListener("blur", function(){ ui.count.closer = closerInput.value; });
    }
    var searchInput = app.querySelector('[data-action="set-search"]');
    if(searchInput) searchInput.addEventListener("input", function(){ ui.count.search = searchInput.value; render(); });
    var reportDate = app.querySelector('[data-action="set-report-date"]');
    if(reportDate) reportDate.addEventListener("change", function(){ ui.dashboardDate = reportDate.value; render(); });

    var staffToggle = app.querySelector('[data-action="toggle-staffing"]');
    if(staffToggle) staffToggle.addEventListener("change", function(){ ui.count.staffing.ok = staffToggle.checked; render(); });
    var staffDetail = app.querySelector('[data-action="set-staffing-detail"]');
    if(staffDetail) staffDetail.addEventListener("input", function(){ ui.count.staffing.detail = staffDetail.value; });
    var staffCoverage = app.querySelector('[data-action="set-staffing-coverage"]');
    if(staffCoverage) staffCoverage.addEventListener("change", function(){ ui.count.staffing.coverage = staffCoverage.value; });

    app.querySelectorAll('[data-action="toggle-fd"]').forEach(function(cb){
      cb.addEventListener("change", function(){ ui.count.frontDesk[cb.getAttribute("data-field")].ok = cb.checked; render(); });
    });
    app.querySelectorAll('[data-action="set-fd-detail"]').forEach(function(ta){
      ta.addEventListener("input", function(){ ui.count.frontDesk[ta.getAttribute("data-field")].detail = ta.value; });
    });

    var cleanToggle = app.querySelector('[data-action="toggle-cleaning"]');
    if(cleanToggle) cleanToggle.addEventListener("change", function(){ ui.count.cleaningOk = cleanToggle.checked; render(); });
    var cleanText = app.querySelector('[data-action="set-cleaning"]');
    if(cleanText) cleanText.addEventListener("input", function(){ ui.count.cleaningText = cleanText.value; });
    var opsToggle = app.querySelector('[data-action="toggle-ops"]');
    if(opsToggle) opsToggle.addEventListener("change", function(){ ui.count.opsOk = opsToggle.checked; render(); });
    var opsText = app.querySelector('[data-action="set-ops"]');
    if(opsText) opsText.addEventListener("input", function(){ ui.count.opsText = opsText.value; });
    var nothingToggle = app.querySelector('[data-action="toggle-nothing"]');
    if(nothingToggle) nothingToggle.addEventListener("change", function(){
      ui.count.nothingToRestock = nothingToggle.checked;
      if(nothingToggle.checked) ui.count.selected = {};
      render();
    });
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");
    if(action==="tab"){ ui.tab = el.getAttribute("data-tab"); render(); }
    else if(action==="pick-location"){ selectLocation(el.getAttribute("data-loc")); }
    else if(action==="set-catalog-tab"){ ui.count.catalogTab = el.getAttribute("data-tab"); render(); }
    else if(action==="toggle-catalog-item"){ toggleCatalogItem(el.getAttribute("data-id")); }
    else if(action==="remove-restock"){ delete ui.count.selected[el.getAttribute("data-id")]; render(); }
    else if(action==="submit-count"){ submitCount(); }
    else if(action==="toggle-history"){
      var key = el.getAttribute("data-key");
      ui.historyOpen[key] = !ui.historyOpen[key];
      render();
    }
    else if(action==="add-catalog-item"){ readDraftFromInputs(); addCatalogItem(el.getAttribute("data-tab")); }
    else if(action==="remove-catalog-item"){ readDraftFromInputs(); removeCatalogItem(el.getAttribute("data-id")); }
    else if(action==="add-catalog-tab"){
      var tabInput = document.getElementById("new-tab-name");
      readDraftFromInputs();
      addCatalogTab(tabInput ? tabInput.value : "");
    }
    else if(action==="add-location"){
      var locInput = document.getElementById("new-loc-name");
      readDraftFromInputs();
      addLocation(locInput ? locInput.value : "");
    }
    else if(action==="save-catalog"){ readDraftFromInputs(); saveManageDraft(); }
    else if(action==="discard-manage"){ ui.manageDraft = null; render(); }
  });

  /* ---------- boot ---------- */
  function injectStyle(){
    var style = document.createElement("style");
    style.textContent = CSS_TEXT;
    document.head.appendChild(style);
  }

  function startFirebaseSync(){
    DOC_REF.onSnapshot(function(snap){
      if(snap.exists){
        STATE = snap.data();
      } else {
        /* first time ever \u2014 seed the shared database with the built-in catalog */
        DOC_REF.set(STATE).catch(function(err){
          showToast("Couldn\u2019t create the shared database \u2014 check your Firebase setup.");
        });
      }
      render();
    }, function(err){
      showToast("Couldn\u2019t connect to the shared database \u2014 check your Firebase setup.");
    });
  }

  injectStyle();
  render();
  startFirebaseSync();
}

appMain();
</script>
</body>
</html>
